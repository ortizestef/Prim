name: Check live Arcadeverse website

on:
  workflow_run:
    workflows:
      - Publish ARCADEVERSE to GitHub Pages
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  live-site-smoke-test:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Inspect GitHub Pages configuration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location --output /tmp/pages-config.json --write-out '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/ortizestef/Prim/pages")"
          echo "GitHub Pages settings API status: $status"
          test "$status" = "200"
          cat /tmp/pages-config.json
          echo
          jq -e '.build_type == "workflow" and .public == true' /tmp/pages-config.json >/dev/null

      - name: Fetch the public homepage and verify its bundles
        shell: bash
        run: |
          set -euo pipefail
          SITE_URL="https://ortizestef.github.io/Prim/"
          READY=false
          for attempt in $(seq 1 18); do
            status="$(curl --silent --show-error --location --max-time 20 \
              --output /tmp/arcadeverse-index.html --write-out '%{http_code}' \
              "${SITE_URL}?check=${GITHUB_RUN_ID}")"
            if [[ "$status" = "200" ]] && grep -q "/Prim/assets/index-" /tmp/arcadeverse-index.html; then
              READY=true
              break
            fi
            echo "Waiting for the new Pages deployment (attempt $attempt/18, HTTP $status)."
            sleep 5
          done

          test "$READY" = "true"
          if grep -q "/src/main.tsx" /tmp/arcadeverse-index.html; then
            echo "The published page still points to the development entry point."
            exit 1
          fi

          JS_PATH="$(grep -oE 'src="/Prim/assets/index-[^"]+\.js"' /tmp/arcadeverse-index.html | head -n 1 | cut -d '"' -f 2)"
          CSS_PATH="$(grep -oE 'href="/Prim/assets/index-[^"]+\.css"' /tmp/arcadeverse-index.html | head -n 1 | cut -d '"' -f 2)"
          test -n "$JS_PATH"
          test -n "$CSS_PATH"

          curl --fail --silent --show-error --location "https://ortizestef.github.io$JS_PATH" -o /dev/null
          curl --fail --silent --show-error --location "https://ortizestef.github.io$CSS_PATH" -o /dev/null
          echo "Live website, JavaScript and CSS bundles are responding."
