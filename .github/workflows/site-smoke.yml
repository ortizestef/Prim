name: Check live Arcadeverse website

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - ".nojekyll"
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  live-site-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect GitHub Pages configuration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location --output /tmp/pages-config.json --write-out '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/ortizestef/Prim/pages")"
          echo "GitHub Pages settings API status: $status"
          cat /tmp/pages-config.json
          echo

      - name: Fetch the public homepage and its bundles
        shell: bash
        run: |
          set -euo pipefail
          SITE_URL="https://ortizestef.github.io/Prim/"
          status="$(curl --silent --show-error --location --max-time 20 --output /tmp/arcadeverse-index.html --write-out '%{http_code}' "$SITE_URL")"
          echo "Public homepage HTTP status: $status"
          echo "Public homepage HTML:"
          sed -n '1,80p' /tmp/arcadeverse-index.html

          test "$status" = "200"
          test -s /tmp/arcadeverse-index.html
          if ! grep -q "/Prim/assets/index-" /tmp/arcadeverse-index.html; then
            echo "The live site is not serving the compiled Vite index."
            exit 1
          fi
          if grep -q "/src/main.tsx" /tmp/arcadeverse-index.html; then
            echo "The published page still points to the development entry point."
            exit 1
          fi

          JS_PATH="$(grep -oE 'src="/Prim/assets/index-[^"]+\.js"' /tmp/arcadeverse-index.html | head -n 1 | cut -d '"' -f 2)"
          CSS_PATH="$(grep -oE 'href="/Prim/assets/index-[^"]+\.css"' /tmp/arcadeverse-index.html | head -n 1 | cut -d '"' -f 2)"
          test -n "$JS_PATH"
          test -n "$CSS_PATH"

          curl --fail --silent --show-error --location "https://ortizestef.github.io$JS_PATH" -o /dev/null
          curl --fail --silent --show-error --location "https://ortizestef.github.io$CSS_PATH" -o /dev/null
          echo "Live website and its JavaScript/CSS bundles are responding."
