name: Build and publish Arcadeverse site

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "vite.config.ts"
      - "tsconfig.json"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arcadeverse-static-site
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Build production website
        run: npm run build

      - name: Verify production output
        run: |
          test -s dist/index.html
          test -d dist/assets
          grep -q "/Prim/assets/" dist/index.html
          if grep -q "/src/main.tsx" dist/index.html; then
            echo "Development entry point found in production HTML."
            exit 1
          fi

      - name: Publish compiled website to the Pages branch root
        run: |
          rm -rf assets
          mkdir -p assets
          cp -R dist/assets/. assets/
          cp dist/index.html index.html
          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets .nojekyll

          if git diff --cached --quiet; then
            echo "Published website is already up to date."
          else
            git commit -m "chore: publish compiled Arcadeverse site [skip ci]"
            git push origin HEAD:main
          fi
